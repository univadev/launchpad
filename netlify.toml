[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Daily at 13:00 UTC (9am Eastern). See the function for what it sends.
[functions."deadline-reminders"]
  schedule = "0 13 * * *"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
